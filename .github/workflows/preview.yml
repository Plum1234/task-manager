name: Replit Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: replit-preview
  cancel-in-progress: true
env:
  APP_NAME: ${{ vars.APP_NAME }}        # Replit deployment name, e.g. task-manager-4
  DEPLOY_BRANCH: replit-preview         # the single branch Replit watches
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate config
        run: |
          set -euo pipefail
          : "${APP_NAME:?Set repo variable APP_NAME (e.g. task-manager-4)}"
      - name: Push PR code to preview branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Same-repo force-push using the built-in token (no PAT needed).
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${DEPLOY_BRANCH}"
      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const pr = Number(process.env.PR_NUMBER);
            const url = `https://${process.env.APP_NAME}.replit.app`;
            const marker = "<!-- replit-preview-bot -->";
            const body = [
              marker,
              `🚀 Preview: ${url}`,
              ``,
              `_Shared Replit preview - serving PR #${pr} (latest deploy wins, live ~1 min after this runs)._`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
